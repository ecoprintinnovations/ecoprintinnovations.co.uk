<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">Eco engineering idea tree</title>
  <desc id="desc">A refined studio illustration of a tree, branch, apple and engineering blueprint details.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#edf4ea"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ab98b"/>
      <stop offset=".55" stop-color="#5f9366"/>
      <stop offset="1" stop-color="#315f42"/>
    </linearGradient>
    <linearGradient id="leafB" x1=".1" y1=".1" x2="1" y2="1">
      <stop offset="0" stop-color="#b3c99d"/>
      <stop offset=".6" stop-color="#6e9d70"/>
      <stop offset="1" stop-color="#406d4c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a623f"/>
      <stop offset=".5" stop-color="#6f4d32"/>
      <stop offset="1" stop-color="#49311f"/>
    </linearGradient>
    <radialGradient id="apple" cx=".34" cy=".28" r=".72">
      <stop offset="0" stop-color="#ffd6c7"/>
      <stop offset=".38" stop-color="#ce5846"/>
      <stop offset="1" stop-color="#7b2d25"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#203427" flood-opacity=".15"/>
    </filter>
  </defs>

